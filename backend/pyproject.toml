[project]
name = "newsagg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=0.10",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "playwright>=1.43",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "youtube-transcript-api>=0.6",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "ollama>=0.4",
    "pytz",
    "json-repair",
    "zeroconf>=0.131",
    "googlenewsdecoder>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
newsagg = "newsagg.main:run"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["newsagg*"]
