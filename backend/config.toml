[server]
host = "0.0.0.0"
port = 8000
db_path = "news.duckdb"

[ollama]
#base_url = "http://localhost:11434"
base_url = "http://p1gen4.home.org.au:11434"
model = "mistral"
embed_model = "nomic-embed-text"
summary_max_tokens = 10240

[scheduler]
default_interval_seconds = 900
min_interval_seconds = 60
max_interval_seconds = 86400
active_reader_boost = 0.25
breaking_news_threshold = 5
breaking_news_window_minutes = 10

[interest]
decay_rate = 0.01
learn_rate_read = 0.15
learn_rate_discard = -0.05
learn_rate_follow = 0.25
learn_rate_save = 0.30
learn_rate_interest_up = 0.20
learn_rate_interest_down = -0.15

# Geographic interest boosting.
# For each level, map place name -> interest weight (0.0=suppress, 0.5=neutral, 1.0=boost).
# Matching is case-insensitive and partial (e.g. "Queensland" matches "Southeast Queensland").
[geography.city]
Brisbane = 0.90
"Gold Coast" = 0.80
"Sunshine Coast" = 0.80
Zurich = 0.90
Austin = 0.40

[geography.state]
Queensland = 0.75

[geography.country]
Australia = 0.65
Switzerland = 0.65
Germany = 0.65

[geography.region]
"Asia-Pacific" = 0.60
Oceania = 0.60

[[sources]]
id = "hn"
type = "hackernews"
label = "Hacker News"
min_score = 50

[[sources]]
id = "lobsters"
type = "rss"
label = "Lobsters"
url = "https://lobste.rs/rss"

[[sources]]
id = "google_news_tech"
type = "google_news"
label = "Google News: Technology"
query = "technology"

[[sources]]
id = "reddit_programming"
type = "reddit"
label = "r/programming"
subreddit = "programming"
sort = "hot"
limit = 25

[[sources]]
id = "ABC-QLD-News"
type = "rss"
label = "ABC QLD News"
url = "https://www.abc.net.au/news/feed/5555988/rss.xml"

[[sources]]
id = "theguardian"
type = "rss"
label = "the guardian"
url = "https://www.theguardian.com/world/rss"
